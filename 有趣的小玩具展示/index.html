<!doctype html>
<html lang="zh-CN">
<head>
  <meta name="description" content="庞博约的可视化项目集：在平面上拧魔方、立体资料馆与相机对焦。">
  <link rel="canonical" href="https://pangboyue.com/有趣的小玩具展示/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191d22">
  <title>可视化项目集 | 庞博约</title>
  <link rel="icon" type="image/x-icon" href="../site-icon-v2.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="../site-icon-v2-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../site-icon-v2-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: #171b20; color: #f3f6f8; }
    a { color: inherit; }
    .site-header { height: 74px; display: flex; align-items: center; justify-content: space-between; padding: 0 max(5vw, 24px); background: #1c2127; border-bottom: 1px solid #39444d; }
    .brand { font-size: 20px; font-weight: 650; letter-spacing: .04em; text-decoration: none; }
    .home-link { font-size: 14px; color: #bbc6cd; text-decoration: none; transition: color .2s; }
    .home-link:hover { color: #fff; }
    .hero { min-height: 228px; position: relative; overflow: hidden; background: linear-gradient(110deg, #17577a 0%, #588294 42%, #deb28f 74%, #f4a95f 100%); }
    .hero::before { content: ""; position: absolute; width: 420px; height: 420px; border-radius: 50%; left: 19%; top: -240px; background: #a9e4e833; filter: blur(25px); }
    .hero::after { content: ""; position: absolute; width: 500px; height: 250px; border-radius: 50%; right: 4%; bottom: -175px; background: #fff4ce33; filter: blur(35px); }
    .hero-content { position: relative; z-index: 1; width: min(1500px, 100%); margin: 0 auto; padding: 24px clamp(22px, 5vw, 76px); color: #fff; }
    .hero-title, .hero-source { margin: 0; font-family: ui-monospace, "SFMono-Regular", Menlo, "PingFang SC", "Microsoft YaHei", sans-serif; text-shadow: 0 2px 3px #101923a6, 0 6px 14px #10192399, 0 0 22px #10192370; }
    .hero-title { font-size: clamp(42px, 4.6vw, 76px); font-weight: 800; line-height: 1.16; letter-spacing: .02em; }
    .hero-source { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: clamp(26px, 2.25vw, 38px); font-style: italic; font-weight: 700; line-height: 1.25; letter-spacing: .03em; }
    .source-icons { display: inline-flex; align-items: center; gap: 10px; }
    .source-icons img { display: block; height: 48px; width: auto; }
    .source-icons .bilibili-icon { height: 43px; }
    .catalog { width: min(1500px, 100%); margin: 0 auto; padding: 26px clamp(22px, 5vw, 76px) 80px; }
    .card-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    .toy-card { min-width: 0; min-height: 392px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #4a5863; border-radius: 8px; background: #1b2026; box-shadow: 0 10px 30px #080e1421; }
    a.toy-card { text-decoration: none; transition: border-color .22s, transform .22s, box-shadow .22s; }
    a.toy-card:hover { border-color: #8bd7eb; transform: translateY(-5px); box-shadow: 0 18px 38px #080e1455; }
    a.toy-card:focus-visible, .home-link:focus-visible, .brand:focus-visible { outline: 2px solid #91d8e8; outline-offset: 4px; }
    .card-title { height: 76px; margin: 0; padding: 21px 22px 10px; font-size: clamp(20px, 1.7vw, 26px); font-weight: 660; color: #79d0e6; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
    .card-empty-copy { flex: 1; min-height: 58px; }
    .card-art { aspect-ratio: 1.8; margin: 0 10px 10px; display: grid; place-items: center; overflow: hidden; background: #252f38; }
    .card-art picture { display: grid; place-items: center; width: 100%; height: 100%; }
    .card-art img { display: block; width: 84%; max-height: 84%; object-fit: contain; }
    .card-bottom { height: 44px; flex: none; display: grid; place-items: center; background: #2a84ad; color: #fff; font: 600 18px ui-monospace, "SFMono-Regular", Menlo, sans-serif; letter-spacing: .02em; }
    @media (max-width: 900px) { .card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 620px) { .site-header { height: 62px; } .hero { min-height: 170px; } .hero-content { padding-top: 20px; } .hero-title { font-size: clamp(34px, 8vw, 48px); } .hero-source { font-size: clamp(25px, 6vw, 34px); margin-top: 10px; } .source-icons img { height: 38px; } .source-icons .bilibili-icon { height: 34px; } .catalog { padding-top: 20px; } .card-grid { grid-template-columns: 1fr; gap: 18px; } .toy-card { min-height: 350px; } }
    @media (prefers-reduced-motion: reduce) { a.toy-card { transition: none; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">庞博约</a>
    <a class="home-link" href="/">返回首页</a>
  </header>
  <section class="hero" aria-label="可视化项目集">
    <div class="hero-content">
      <h1 class="hero-title">可视化项目集</h1>
      <p class="hero-source">灵感来源 <span class="source-icons" aria-label="X 和 bilibili"><img src="assets/x-cutout.svg" alt="X"><img class="bilibili-icon" src="assets/bilibili-cutout.svg" alt="bilibili"></span></p>
    </div>
  </section>
  <main class="catalog">
    <div class="card-grid">
      <a class="toy-card" href="cube/cube.html" aria-label="进入在平面上拧魔方">
        <h2 class="card-title">在平面上拧魔方</h2>
        <div class="card-empty-copy" aria-hidden="true"></div>
        <div class="card-art"><picture><source type="image/avif" srcset="assets/cube-plane-preview.avif"><img src="assets/cube-plane-preview.png" alt="平面魔方的彩色节点与旋转轨道" loading="eager"></picture></div>
        <div class="card-bottom">sample</div>
      </a>
      <a class="toy-card" href="rhine/" aria-label="进入立体资料馆">
        <h2 class="card-title">立体资料馆</h2>
        <div class="card-empty-copy" aria-hidden="true"></div>
        <div class="card-art"><picture><source type="image/avif" srcset="assets/rhine-preview.avif"><img src="assets/rhine-preview.png" alt="立体资料馆封面" loading="lazy" decoding="async"></picture></div>
        <div class="card-bottom">sample</div>
      </a>
      <a class="toy-card" href="camera-focus/" aria-label="进入相机对焦">
        <h2 class="card-title">相机对焦</h2>
        <div class="card-empty-copy" aria-hidden="true"></div>
        <div class="card-art"><picture><source type="image/avif" srcset="assets/camera-focus-preview.avif"><img src="assets/camera-focus-preview.png" alt="相机对焦演示封面" loading="lazy" decoding="async"></picture></div>
        <div class="card-bottom">sample</div>
      </a>
    </div>
  </main>
</body>
</html>
