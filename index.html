.top-nav {

/* 左侧名字 */

  font-weight: 600;

}

/* 导航 */

.nav-menu {
  display: flex;
  align-items: center;
  gap: 30px;
}

.nav-menu > a,
.nav-link {
  font-family: inherit;

  font-size: 14px;
  font-weight: 450;

  color: #222;

  text-decoration: none;

  background: none;
  border: none;

  padding: 22px 0;

  cursor: pointer;

  transition: opacity 0.2s ease;
}

.nav-menu > a:hover,
.nav-link:hover {
  opacity: 0.55;
}


/* ===== 下拉菜单 ===== */

.nav-dropdown {
  position: relative;
}

.dropdown-menu {
  position: absolute;

  top: 54px;
  left: 50%;

  transform:
    translateX(-50%)
    translateY(-8px);

  min-width: 190px;

  padding: 10px;

  background: rgba(255, 255, 255, 0.96);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border: 1px solid rgba(0, 0, 0, 0.08);

  border-radius: 14px;

  box-shadow:
    0 12px 40px rgba(0, 0, 0, 0.10);

  opacity: 0;
  visibility: hidden;

  transition:
    opacity 0.2s ease,
    transform 0.2s ease,
    visibility 0.2s;
}

.dropdown-menu a {
  display: block;

  padding: 11px 14px;

  border-radius: 9px;

  color: #111;
  text-decoration: none;

  font-size: 14px;

  transition: background 0.15s ease;
}

.dropdown-menu a:hover {
  background: rgba(0, 0, 0, 0.055);
}


/* 鼠标放上去展开 */

.nav-dropdown:hover .dropdown-menu {
  opacity: 1;
  visibility: visible;

  transform:
    translateX(-50%)
    translateY(0);
}
