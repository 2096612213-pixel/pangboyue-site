   /* ===== 顶部导航栏 ===== */

.top-nav {
  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 64px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 36px;

  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border-bottom: 1px solid rgba(0, 0, 0, 0.08);

  z-index: 9999;

  box-sizing: border-box;
}

/* 左侧名字 */

.brand {
  font-size: 19px;
  font-weight: 600;

  color: #111;
  text-decoration: none;

  letter-spacing: -0.02em;
}

/* 导航 */

.nav-menu {
  display: flex;
  align-items: center;
  gap: 30px;
}

.nav-menu > a,
.nav-link {
  font-family: inherit;

  font-size: 14px;
  font-weight: 450;

  color: #222;

  text-decoration: none;

  background: none;
  border: none;

  padding: 22px 0;

  cursor: pointer;

  transition: opacity 0.2s ease;
}

.nav-menu > a:hover,
.nav-link:hover {
  opacity: 0.55;
}


/* ===== 下拉菜单 ===== */

.nav-dropdown {
  position: relative;
}

.dropdown-menu {
  position: absolute;

  top: 54px;
  left: 50%;

  transform:
    translateX(-50%)
    translateY(-8px);

  min-width: 190px;

  padding: 10px;

  background: rgba(255, 255, 255, 0.96);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border: 1px solid rgba(0, 0, 0, 0.08);

  border-radius: 14px;

  box-shadow:
    0 12px 40px rgba(0, 0, 0, 0.10);

  opacity: 0;
  visibility: hidden;

  transition:
    opacity 0.2s ease,
    transform 0.2s ease,
    visibility 0.2s;
}

.dropdown-menu a {
  display: block;

  padding: 11px 14px;

  border-radius: 9px;

  color: #111;
  text-decoration: none;

  font-size: 14px;

  transition: background 0.15s ease;
}

.dropdown-menu a:hover {
  background: rgba(0, 0, 0, 0.055);
}


/* 鼠标放上去展开 */

.nav-dropdown:hover .dropdown-menu {
  opacity: 1;
  visibility: visible;

  transform:
    translateX(-50%)
    translateY(0);
}


/* 防止导航挡住网页顶部 */

body {
  padding-top: 64px;
}

    .music-box {

}

/* ===== 立体资料馆入口 ===== */

.archive-card {
  display: block;

  width: calc(100% - 120px);
  max-width: 1200px;

  margin: 50px auto 70px auto;

  color: #f2f2f2;
  text-decoration: none;

  cursor: pointer;
}

/* 图片 */

.archive-card img {
  display: block;

  width: 100%;
  height: auto;

  border-radius: 18px;

  transition:
    transform 0.45s ease,
    box-shadow 0.45s ease,
    filter 0.45s ease;

  transform: scale(1);
}

/* 鼠标移上去 */

.archive-card:hover img {
  transform: scale(1.025);

  box-shadow:
    0 0 24px rgba(255, 255, 255, 0.16),
    0 0 60px rgba(255, 255, 255, 0.08);

  filter: brightness(1.03);
}

/* 图片下面的文字 */

/* 整个卡片一起动画 */
.archive-card {
  display: block;

  width: calc(100% - 120px);
  max-width: 1200px;

  margin: 50px auto 70px auto;

  color: #f2f2f2;
  text-decoration: none;
  cursor: pointer;

  transition:
    transform 0.45s ease,
    filter 0.45s ease;
}


/* 图片本身不再单独缩放 */
.archive-card img {
  display: block;

  width: 100%;
  height: auto;

  border-radius: 18px;

  transition:
    box-shadow 0.45s ease,
    filter 0.45s ease;
}


/* 鼠标进入图片或者文字区域
   整个卡片一起放大 */
.archive-card:hover {
  transform: scale(1.025);
}


/* 同时让图片出现白色光晕 */
.archive-card:hover img {
  box-shadow:
    0 0 24px rgba(255, 255, 255, 0.16),
    0 0 60px rgba(255, 255, 255, 0.08);

  filter: brightness(1.03);
}


/* 标题 */
.archive-title {
  margin-top: 18px;

  font-size: 22px;
  font-weight: 500;

  color: #f2f2f2;
  text-decoration: none;

  transition: opacity 0.25s ease;
}


/* hover 时文字稍微亮一点即可 */
.archive-card:hover .archive-title {
  opacity: 1;
}


/* 手机适配 */

  }
}
