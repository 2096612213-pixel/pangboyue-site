.top-nav {
  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 64px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 0 36px;

  background: rgba(255, 255, 255, 0.82);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border-bottom: 1px solid rgba(0, 0, 0, 0.08);

  z-index: 9999;

  box-sizing: border-box;
}

/* 左侧名字 */

.brand {
  font-size: 19px;
  font-weight: 600;

  color: #111;
  text-decoration: none;

  letter-spacing: -0.02em;
}

/* 导航 */

.nav-menu {
  display: flex;
  align-items: center;
  gap: 30px;
}

.nav-menu > a,
.nav-link {
  font-family: inherit;

  font-size: 14px;
  font-weight: 450;

  color: #222;

  text-decoration: none;

  background: none;
  border: none;

  padding: 22px 0;

  cursor: pointer;

  transition: opacity 0.2s ease;
}

.nav-menu > a:hover,
.nav-link:hover {
  opacity: 0.55;
}


/* ===== 下拉菜单 ===== */

.nav-dropdown {
  position: static;
}

.dropdown-menu {
  position: absolute;
  top: calc(100% - 1px);
  left: 0;
  width: 100%;
  box-sizing: border-box;
  background: rgba(8, 10, 13, 0.84);
  backdrop-filter: blur(32px) saturate(155%);
  -webkit-backdrop-filter: blur(32px) saturate(155%);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-top-color: rgba(255, 255, 255, 0.18);
  border-radius: 0 0 24px 24px;
  box-shadow: inset 0 1px rgba(255, 255, 255, 0.09),
    0 28px 70px rgba(0, 0, 0, 0.38);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateY(-10px) scaleY(.94);
  transform-origin: top center;
  clip-path: inset(0 0 100% 0);
  transition: opacity .28s ease,
    transform .42s cubic-bezier(.22, 1, .36, 1),
    clip-path .42s cubic-bezier(.22, 1, .36, 1),
    visibility 0s linear .42s;
}

.dropdown-menu::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(125deg, rgba(255, 255, 255, .055), transparent 40%, rgba(255, 255, 255, .018));
  pointer-events: none;
}

.dropdown-inner {
  position: relative;
  left: var(--menu-x, 40px);
  width: 156px;
  padding: 34px 0 24px;
}

.dropdown-links {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 20px;
}

.dropdown-links a {
  width: fit-content;
  color: #f5f5f5;
  text-decoration: none;
  font-size: 18px;
  font-weight: 500;
  line-height: 1.3;
  transition: color .2s ease, transform .2s ease;
}

.dropdown-links a:hover,
.dropdown-links a:focus-visible {
  color: #fff;
  transform: translateX(5px);
  text-shadow: 0 0 18px rgba(255, 255, 255, .35);
}


/* 鼠标放上去展开 */

.nav-dropdown:hover .dropdown-menu,
.nav-dropdown:focus-within .dropdown-menu {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transform: translateY(0) scaleY(1);
  clip-path: inset(0 0 0 0);
  transition: opacity .28s ease,
    transform .42s cubic-bezier(.22, 1, .36, 1),
    clip-path .42s cubic-bezier(.22, 1, .36, 1),
    visibility 0s;
}

@media (max-width: 768px) {
  .dropdown-menu { max-height: calc(100vh - 64px); overflow-y: auto; }
  .dropdown-inner { padding: 28px 0 24px; }
  .dropdown-links { gap: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  .dropdown-menu, .dropdown-links a { transition: none; }
}

<script>
  // Keep the page at its true top edge in Safari while allowing normal scrolling.
  function preventTopOverscroll(event, pullingDown) {
    if (!pullingDown || window.scrollY > 0 || !event.cancelable) return;
    const menu = event.target instanceof Element ? event.target.closest('.dropdown-menu') : null;
    if (menu && menu.scrollTop > 0) return;
    event.preventDefault();
  }

  window.addEventListener('wheel', event => {
    if (!event.ctrlKey) preventTopOverscroll(event, event.deltaY < 0);
  }, { passive: false });

  let touchStartY = 0;
  window.addEventListener('touchstart', event => {
    if (event.touches.length === 1) touchStartY = event.touches[0].clientY;
  }, { passive: true });
  window.addEventListener('touchmove', event => {
    if (event.touches.length === 1) {
      preventTopOverscroll(event, event.touches[0].clientY > touchStartY);
    }
  }, { passive: false });

  function alignDropdowns() {
    const header = document.querySelector('.top-nav');
    const headerLeft = header.getBoundingClientRect().left;
    header.querySelectorAll('.nav-dropdown').forEach(dropdown => {
      const trigger = dropdown.querySelector('.nav-link');
      const menu = dropdown.querySelector('.dropdown-menu');
      const contentWidth = menu.querySelector('.dropdown-inner').offsetWidth;
      const triggerLeft = trigger.getBoundingClientRect().left - headerLeft;
      const left = Math.max(16, Math.min(triggerLeft, header.clientWidth - contentWidth - 16));
      menu.style.setProperty('--menu-x', `${left}px`);
    });
  }

  alignDropdowns();
  window.addEventListener('resize', alignDropdowns);

  function updateBeijingTime() {

    const now = new Date();

    const formatter = new Intl.DateTimeFormat("zh-CN", {
      timeZone: "Asia/Shanghai",

      year: "numeric",
      month: "long",
      day: "numeric",

      weekday: "long",

      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",

      hour12: false
    });

    const timeText = formatter.format(now);

    const clock = document.getElementById("beijing-time");
    clock.textContent = "北京时间 · " + timeText;
    // Reserve the clock's width once so changing seconds never shifts the icon.
    if (!clock.style.width) clock.style.width = Math.ceil(clock.getBoundingClientRect().width) + "px";
  }

  updateBeijingTime();
  window.addEventListener('resize', () => {
    const clock = document.getElementById('beijing-time');
    clock.style.width = '';
    clock.style.width = Math.ceil(clock.getBoundingClientRect().width) + 'px';
  });

  setInterval(updateBeijingTime, 1000);
</script>
