<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>我现在每天正在做的事</title>

  <!-- Markdown 渲染库 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 80px 10%;

      background: #0f0f0f;
      color: #e8e8e8;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }


    /* =========================
       页面主体
       ========================= */

    .daily-container {
      max-width: 900px;
      margin: 0 auto;
    }


    /* =========================
       页面大标题
       ========================= */

    .page-title {
      font-size: 46px;
      font-weight: 600;

      margin-bottom: 60px;

      color: #ffffff;
    }


    /* =========================
       Markdown 正文
       ========================= */

    #markdown-content {
      font-size: 18px;
      line-height: 1.9;

      color: #d8d8d8;
    }


    #markdown-content h1 {
      font-size: 34px;

      margin-top: 60px;
      margin-bottom: 25px;

      color: #ffffff;
    }


    #markdown-content h2 {
      font-size: 25px;

      margin-top: 55px;
      margin-bottom: 22px;

      color: #ffffff;
    }


    #markdown-content h3 {
      font-size: 20px;

      margin-top: 35px;

      color: #ffffff;
    }


    #markdown-content p {
      margin: 18px 0;
    }


    #markdown-content ul {
      padding-left: 34px;
    }


    #markdown-content li {
      margin: 10px 0;
    }


    #markdown-content a {
      color: #ffffff;
    }


    /* =========================
       生词列表
       ========================= */

    /* 只改这里的 4：可以写 3、4、5。窄屏会自动减少列数。 */
    :root {
      --vocab-columns: 4;
    }

    #markdown-content ul.vocab-grid {
      /* 先从上往下，再从左往右；各列宽度一致、间距一致。 */
      column-count: var(--vocab-columns);
      column-gap: 40px;
      column-fill: balance;

      /* 列表比正文更宽，因此第一列也会更靠左。 */
      width: min(1500px, calc(100vw - 64px));
      max-width: none;
      position: relative;
      left: 50%;
      transform: translateX(-50%);
      padding: 0;
      margin: 25px 0 60px;
      list-style: none;
    }

    #markdown-content ul.vocab-grid > li {
      /* 一个词条不拆到两列；长释义在本列内换行。 */
      break-inside: avoid;
      margin: 0;
      padding: 0 0 12px;
      line-height: 1.8;
      white-space: normal;
      overflow-wrap: anywhere;
    }


    /* =========================
       分割线
       ========================= */

    #markdown-content hr {
      border: none;

      border-top:
        1px solid rgba(255, 255, 255, 0.15);

      margin: 50px 0;
    }


    /* 窄屏自动减少列数，避免五列挤在一起。 */
    @media (max-width: 1200px) {
      #markdown-content ul.vocab-grid {
        column-count: min(var(--vocab-columns), 3);
        column-gap: 32px;
      }
    }

    @media (max-width: 850px) {
      body { padding: 60px 7%; }
      .page-title { font-size: 38px; }
      #markdown-content ul.vocab-grid {
        column-count: min(var(--vocab-columns), 2);
        column-gap: 28px;
      }
    }

    @media (max-width: 600px) {
      body { padding: 40px 24px; }
      .page-title { font-size: 31px; margin-bottom: 45px; }
      #markdown-content { font-size: 16px; }
      #markdown-content h2 { font-size: 21px; }
      #markdown-content ul.vocab-grid {
        column-count: 1;
        width: 100%;
        position: static;
        transform: none;
      }
    }

  </style>
</head>


<body>

  <main class="daily-container">

    <div class="page-title">
      我现在每天正在做的事
    </div>


    <div id="markdown-content">
      正在读取……
    </div>

  </main>


  <script>

    fetch("daily.md")

      .then(response => {

        if (!response.ok) {
          throw new Error("无法读取 daily.md");
        }

        return response.text();

      })

      .then(markdown => {

        const content =
          document.getElementById("markdown-content");


        /*
          先把 Markdown 转换成 HTML
        */

        content.innerHTML =
          marked.parse(markdown);


        /*
          自动寻找所有标题中包含
          “生词记录” 的 h2。

          如果标题后面的元素是 ul，
          就给这个 ul 加上 vocab-grid。

          因此以后完全不需要改 HTML。
        */

        const headings = content.querySelectorAll("h2");

headings.forEach(heading => {

  if (heading.textContent.includes("生词记录")) {

    let element = heading.nextElementSibling;

    while (element) {

      if (element.tagName === "UL") {
        element.classList.add("vocab-grid");
        break;
      }

      if (/^H[12]$/.test(element.tagName)) {
        break;
      }

      element = element.nextElementSibling;
    }

  }

});

      })

      .catch(error => {

        document.getElementById(
          "markdown-content"
        ).innerHTML =
          "内容读取失败。";

        console.error(error);

      });

  </script>

</body>

</html>
