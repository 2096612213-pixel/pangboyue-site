<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta name="description" content="庞博约最爱的歌曲列表与播放器。">
  <link rel="canonical" href="https://pangboyue.com/favorsongs/">
  <link rel="icon" type="image/x-icon" href="../site-icon-v2.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="../site-icon-v2-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../site-icon-v2-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>最爱的歌曲 | Boyue Pang</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #0f0f0f;
      color: #f2f2f2;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "PingFang SC",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    .page {
      width: min(1100px, calc(100% - 48px));
      margin: 0 auto;

      padding: 90px 0 120px;
    }

    .back {
      display: inline-block;

      margin-bottom: 70px;

      color: rgba(255,255,255,0.55);
      text-decoration: none;

      font-size: 14px;

      transition: color 0.25s ease;
    }

    .back:hover {
      color: #ffffff;
    }

    .title {
      margin: 0;

      font-size: 54px;
      font-weight: 500;

      letter-spacing: -0.03em;
    }

    .star {
      color: #ff3b30;

      font-size: 0.65em;

      margin-left: 8px;

      vertical-align: 6px;
    }

    .subtitle {
      margin-top: 18px;
      margin-bottom: 70px;

      color: rgba(255,255,255,0.45);

      font-size: 16px;
      line-height: 1.8;
    }

    .song-search { margin: -28px 0 26px; }
    .search-glass {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 64px;
      padding: 0 22px;
      border: 1px solid rgba(255,255,255,.24);
      border-radius: 24px;
      background: radial-gradient(ellipse at 12% 0%, rgba(178,219,255,.16), transparent 65%), linear-gradient(135deg, rgba(255,255,255,.12), rgba(255,255,255,.025) 55%, rgba(184,208,255,.08));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(255,255,255,.07), 0 12px 34px rgba(0,0,0,.22);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      backdrop-filter: blur(24px) saturate(160%);
      transition: border-color .2s, box-shadow .2s;
    }
    .search-glass:focus-within { border-color: rgba(174,219,255,.7); box-shadow: inset 0 1px 0 #ffffff55, 0 0 0 3px #8bc9ff16, 0 12px 34px #00000038; }
    .search-glass svg { width: 21px; height: 21px; flex: none; color: #c4d3df; }
    .search-glass input { flex: 1; min-width: 0; width: 100%; padding: 20px 0; border: 0; outline: 0; background: transparent; color: #f2f2f2; font: inherit; font-size: 16px; color-scheme: dark; }
    .search-glass input::placeholder { color: #aab1ba; }
    .search-enter { flex: none; padding: 4px 8px; border: 1px solid #ffffff20; border-radius: 7px; color: #c5ccd3; font: 12px inherit; }
    .search-status { min-height: 22px; margin: 10px 8px 0; color: #aab5c2; font-size: 13px; line-height: 1.7; }
    .song.search-match { border-color: #a6d8ff99; background: #99caff12; box-shadow: 0 0 0 2px #a6d8ff16; }
    .song:focus-visible { outline: 2px solid #a6d8ff; outline-offset: 4px; }
    @media (max-width: 700px) { .search-glass { padding: 0 16px; gap: 10px; border-radius: 21px; } .search-enter { display: none; } }
    @media (prefers-reduced-motion: reduce) { .search-glass, .song { transition: none; } }

    .songs {
      --card-height: 166px;
      --card-gap: 24px;
      position: relative;
    }

    .song {
      position: absolute;
      left: 0;
      right: 0;
      height: var(--card-height);
      padding: 28px 30px;

      border:
        1px solid rgba(255,255,255,0.08);

      border-radius: 20px;

      background:
        rgba(255,255,255,0.035);

      transition:
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        background 0.45s ease,
        border-color 0.45s ease;
    }

    .song:hover {
      transform: translateY(-4px);

      background:
        rgba(255,255,255,0.055);

      border-color:
        rgba(255,255,255,0.14);
    }

    .song-name {
      display: block;

      margin-bottom: 20px;

      font-size: 22px;
      font-weight: 500;
    }

    .player {
      position: relative;
    }

    audio {
      display: block;
      width: 100%;
    }

    audio[hidden] {
      display: none;
    }

    .load-play {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 54px;
      padding: 0 18px;
      border: 0;
      border-radius: 28px;
      background: #f1f3f4;
      color: #202124;
      font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer;
    }

    .play-triangle {
      font-size: 15px;
    }

    .play-progress {
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: #bdc1c6;
    }

    .play-volume,
    .play-more {
      font-size: 18px;
      color: #666;
    }

    .load-play:focus-visible {
      outline: 2px solid #75b8ff;
      outline-offset: 2px;
    }


    @media (max-width: 700px) {
      .page {
        width: calc(100% - 28px);

        padding-top: 55px;
      }

      .title {
        font-size: 38px;
      }

      .songs {
        --card-height: 184px;
      }

      .song {
        padding: 22px 18px;
      }

      .song-name {
        font-size: 19px;
      }
    }
  </style>
</head>


<body>

  <main class="page">

    <a href="../index.html" class="back">
      ← 返回主页
    </a>


    <h1 class="title">
      最爱的歌曲
      <span class="star">★</span>
    </h1>

    <p class="subtitle">
      一些我会反复听的歌。
    </p>


    <form class="song-search" id="song-search" role="search" aria-label="搜索歌单">
      <div class="search-glass">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5" stroke-linecap="round"/></svg>
        <input id="song-query" type="search" aria-label="搜索歌名或歌手" aria-describedby="search-status" placeholder="搜索歌名或歌手，按 Enter 跳转" autocomplete="off" enterkeyhint="search">
        <span class="search-enter" aria-hidden="true">Enter ↵</span>
      </div>
      <p class="search-status" id="search-status" role="status" aria-live="polite">搜索只定位歌曲，点击播放按钮开始听。</p>
    </form>

    <section class="songs" id="songs" role="list" aria-label="最爱的歌曲"></section>

  </main>

  <script type="module" src="playlist.js?v=20261002-search"></script>
</body>

</html>
