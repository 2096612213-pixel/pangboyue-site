<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta name="description" content="庞博约最爱的歌曲列表与播放器。">
  <link rel="canonical" href="https://pangboyue.com/favorsongs/">
  <link rel="icon" type="image/x-icon" href="../site-icon-v2.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="../site-icon-v2-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../site-icon-v2-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>最爱的歌曲 | Boyue Pang</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #0f0f0f;
      color: #f2f2f2;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "PingFang SC",
        "Helvetica Neue",
        Arial,
        sans-serif;
    }

    .page {
      width: min(1100px, calc(100% - 48px));
      margin: 0 auto;

      padding: 90px 0 120px;
    }

    .back {
      display: inline-block;

      margin-bottom: 70px;

      color: rgba(255,255,255,0.55);
      text-decoration: none;

      font-size: 14px;

      transition: color 0.25s ease;
    }

    .back:hover {
      color: #ffffff;
    }

    .title {
      margin: 0;

      font-size: 54px;
      font-weight: 500;

      letter-spacing: -0.03em;
    }

    .star {
      color: #ff3b30;

      font-size: 0.65em;

      margin-left: 8px;

      vertical-align: 6px;
    }

    .subtitle {
      margin-top: 18px;
      margin-bottom: 70px;

      color: rgba(255,255,255,0.45);

      font-size: 16px;
      line-height: 1.8;
    }

    .songs {
      --card-height: 166px;
      --card-gap: 24px;
      position: relative;
    }

    .song {
      position: absolute;
      left: 0;
      right: 0;
      height: var(--card-height);
      padding: 28px 30px;

      border:
        1px solid rgba(255,255,255,0.08);

      border-radius: 20px;

      background:
        rgba(255,255,255,0.035);

      transition:
        transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
        background 0.45s ease,
        border-color 0.45s ease;
    }

    .song:hover {
      transform: translateY(-4px);

      background:
        rgba(255,255,255,0.055);

      border-color:
        rgba(255,255,255,0.14);
    }

    .song-name {
      display: block;

      margin-bottom: 20px;

      font-size: 22px;
      font-weight: 500;
    }

    .player {
      position: relative;
    }

    audio {
      display: block;
      width: 100%;
    }

    audio[hidden] {
      display: none;
    }

    .load-play {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      height: 54px;
      padding: 0 18px;
      border: 0;
      border-radius: 28px;
      background: #f1f3f4;
      color: #202124;
      font: 13px -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer;
    }

    .play-triangle {
      font-size: 15px;
    }

    .play-progress {
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: #bdc1c6;
    }

    .play-volume,
    .play-more {
      font-size: 18px;
      color: #666;
    }

    .load-play:focus-visible {
      outline: 2px solid #75b8ff;
      outline-offset: 2px;
    }


    @media (max-width: 700px) {
      .page {
        width: calc(100% - 28px);

        padding-top: 55px;
      }

      .title {
        font-size: 38px;
      }

      .songs {
        --card-height: 184px;
      }

      .song {
        padding: 22px 18px;
      }

      .song-name {
        font-size: 19px;
      }
    }
  </style>
</head>


<body>

  <main class="page">

    <a href="../index.html" class="back">
      ← 返回主页
    </a>


    <h1 class="title">
      最爱的歌曲
      <span class="star">★</span>
    </h1>

    <p class="subtitle">
      一些我会反复听的歌。
    </p>


    <section class="songs" id="songs" role="list" aria-label="最爱的歌曲"></section>

  </main>

  <script type="module" src="playlist.js?v=20260927-fresh-list"></script>
</body>

</html>
