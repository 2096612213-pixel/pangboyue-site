<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Julia verification</title>
<style>body{background:#0b0d13;color:#dae2f4;font:14px/1.65 system-ui;margin:24px}iframe{width:800px;height:600px;border:1px solid #283047;max-width:95vw}button{padding:10px 16px;background:#222d43;color:#fff;border:1px solid #455875;border-radius:10px}.ok{color:#91d3b3}.fail{color:#ffa49e}pre{white-space:pre-wrap}h1{font-weight:400}</style>
<h1>Julia · browser verification</h1><button id="run">Run numerical and interaction checks</button><pre id="report">Ready. Tests run in the artwork iframe below.</pre><iframe id="art" src="../index.html" title="Julia test surface"></iframe>
<script>
const report=document.getElementById('report');const wait=ms=>new Promise(r=>setTimeout(r,ms));
document.getElementById('run').onclick=async function(){
this.disabled=true;const logs=[],results=[];const log=(ok,msg)=>{logs.push((ok?'PASS ':'FAIL ')+msg);results.push({ok,msg});report.textContent=logs.join('\n')};
try{const w=document.getElementById('art').contentWindow,d=w.document,a=w.JuliaArt;if(!a)throw Error('Renderer not initialized');a.reset();await wait(2400);a.pause();await wait(50);const initial=a.getState();
log(initial.webgl>=1&&initial.precision>=23,'WebGL highp initialized: '+JSON.stringify(initial));
let count=0,mismatches=[];
for(const c of [[0,0],[-.8,.156],[-.4,.6],[.285,.01],[-.835,-.2321],[-.70176,-.3842]])for(const z of [[0,0],[.25,.1],[.9,.7],[1.6,.2],[2.2,0],[-1.2,.3],[1,0]]){const cpu=a.referenceEscape(z,c,220),gpu=a.probe(z,c,220);count++;if(cpu.escaped!==gpu.escaped||cpu.iterations!==gpu.iterations)mismatches.push({z,c,cpu,gpu})}
log(mismatches.every(m=>m.cpu.escaped===m.gpu.escaped&&m.cpu.iterations>100&&Math.abs(m.cpu.iterations-m.gpu.iterations)<=2),count+' GPU classifications checked; '+(count-mismatches.length)+' exact iteration counts. Late-orbit float32/double differences (tolerance 2 after iteration 100): '+JSON.stringify(mismatches));
const canvas=d.getElementById('stage');const x=525,y=210;const before=a.complexAt(x,y);canvas.dispatchEvent(new w.WheelEvent('wheel',{clientX:x,clientY:y,deltaY:-140,bubbles:true,cancelable:true}));await wait(1200);const after=a.complexAt(x,y),error=Math.hypot(before[0]-after[0],before[1]-after[1]);
log(error<1e-10&&a.getState().zoom>1,'Wheel zoom anchor error = '+error+'; zoom = '+a.getState().zoom);
const zoom=a.getState().zoom;canvas.dispatchEvent(new w.MouseEvent('dblclick',{clientX:x,clientY:y,bubbles:true}));await wait(1200);log(a.getState().zoom>zoom*2.3,'Double-click smoothly zooms by 2.4×');
const prePan=a.getState().center;canvas.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await wait(900);log(a.getState().center[0]>prePan[0],'Keyboard pan updates complex-plane center');
a.setParameter(-.51,.42);await wait(50);log(Math.abs(a.getState().c[0]+.51)<1e-7&&Math.abs(a.getState().c[1]-.42)<1e-7,'Parameter updates GPU scene state');
const pad=d.getElementById('parameter-pad');pad.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowUp',shiftKey:true,bubbles:true}));await wait(50);log(Math.abs(a.getState().c[1]-.4205)<1e-7,'Parameter pad fine keyboard step = 0.0005');
for(let i=0;i<5;i++){a.selectPreset(i);await wait(2100);const target=[[-.8,.156],[-.4,.6],[.285,.01],[-.835,-.2321],[-.70176,-.3842]][i];log(a.getState().c.every((v,j)=>Math.abs(v-target[j])<1e-4),'Preset '+(i+1)+' settles to supplied Julia parameter')}
d.getElementById('hide').click();log(a.getState().uiHidden,'Hide UI enters immersive state');d.getElementById('show').click();log(!a.getState().uiHidden,'Show UI restores controls');
d.getElementById('drift').click();await wait(1400);log(a.getState().driftClock>0,'Drift evolves on a continuous time path');a.setParameter(-.8,.156);await wait(300);log(a.getState().driftClock===0,'Manual operation pauses drift');await wait(10100);log(a.getState().driftClock>0,'Drift resumes after 10 seconds of inactivity');
a.reset();await wait(2100);const end=a.getState();log(end.c.every((v,i)=>Math.abs(v-[-.8,.156][i])<1e-5)&&Math.abs(end.zoom-1)<1e-5&&end.center.every(v=>Math.abs(v)<1e-5)&&!end.drift,'Reset restores c, center, zoom and stops drift');
log(a.getGLError()===0,'No WebGL error after interaction checks');
report.textContent+='\n\n'+results.filter(x=>x.ok).length+'/'+results.length+' checks passed.';report.className=results.every(x=>x.ok)?'ok':'fail';a.resume();
}catch(e){log(false,e.stack||e.message);report.className='fail'}this.disabled=false;
};
</script></html>
