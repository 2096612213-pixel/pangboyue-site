<!doctype html>
<html lang="zh-CN">
<head>
  <meta name="description" content="按周阅读庞博约的想法、认识与日记。">
  <link rel="canonical" href="https://pangboyue.com/thoughts/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/x-icon" href="../site-icon-v2.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="../site-icon-v2-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../site-icon-v2-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
  <title>各种想法与认识 | 庞博约</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111; color: #eee; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; }
    main { width: min(900px, calc(100% - 48px)); margin: 0 auto; padding: 56px 0 120px; }
    .back { color: #a5a5a5; text-decoration: none; font-size: 14px; }
    .back:hover, .back:focus-visible { color: #fff; }
    h1 { margin: 64px 0 12px; font-size: clamp(32px, 5vw, 48px); font-weight: 600; letter-spacing: -.03em; }
    .intro { margin: 0 0 52px; color: #999; font-size: 16px; line-height: 1.7; }
    .year { margin: 0 0 18px; color: #777; font-size: 13px; font-weight: 600; letter-spacing: .12em; }
    .weeks { display: grid; gap: 14px; }
    .week { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px 28px; border: 1px solid #2d2d2d; border-radius: 18px; background: #191919; color: inherit; text-decoration: none; transition: background .2s, border-color .2s, transform .2s; }
    .week:hover, .week:focus-visible { background: #202020; border-color: #555; transform: translateY(-2px); }
    .week-title { display: block; font-size: 21px; font-weight: 600; }
    .week-date { display: block; margin-top: 8px; color: #999; font-size: 14px; }
    .arrow { color: #999; font-size: 22px; }
    .status { color: #999; line-height: 1.7; }
    @media (max-width: 600px) { main { width: calc(100% - 32px); padding-top: 32px; } h1 { margin-top: 48px; } .week { padding: 20px; } .week-title { font-size: 18px; } }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../index.html">← 返回主页</a>
    <h1>各种想法与认识</h1>
    <p class="intro">按周记录的想法与日记，从最近的一周往前翻阅。</p>
    <section aria-label="周记目录">
      <h2 class="year">周记</h2>
      <div class="weeks" id="weeks"><p class="status">正在加载周记……</p></div>
    </section>
  </main>
  <script type="module">
    import { getWeeks } from "./api.js";
    const container = document.getElementById('weeks');
    getWeeks()
      .then(weeks => {
        container.replaceChildren();
        weeks.sort((a, b) => b.week.localeCompare(a.week));
        for (const entry of weeks) {
          const link = document.createElement('a');
          link.className = 'week';
          link.href = `week.html?week=${encodeURIComponent(entry.week)}`;
          const label = document.createElement('span');
          const title = document.createElement('span');
          title.className = 'week-title';
          title.textContent = entry.title;
          const date = document.createElement('span');
          date.className = 'week-date';
          date.textContent = entry.dateRange;
          const arrow = document.createElement('span');
          arrow.className = 'arrow';
          arrow.setAttribute('aria-hidden', 'true');
          arrow.textContent = '↗';
          label.append(title, date);
          link.append(label, arrow);
          container.append(link);
        }
        if (!weeks.length) container.textContent = '还没有周记。';
      })
      .catch(() => { container.textContent = '周记目录加载失败，请刷新后重试。'; });
  </script>
</body>
</html>
