
    <section class="agent-section" id="digital-agent" aria-label="与庞博约的数字分身对话">
      <div class="agent-panel">
        <div class="agent-empty" id="agent-empty">
          <div class="agent-symbol" tabindex="0" role="img" aria-label="Psi">
            <img class="agent-empty-mark" src="assets/agent-chat/psi.svg?v=__AGENT_ICON_HASH__" width="58" height="58" alt="">
          </div>
        </div>

        <div class="agent-messages" id="agent-messages" role="log" aria-live="polite" aria-label="对话记录" hidden></div>

        <form class="agent-composer" id="agent-form">
          <label class="agent-sr-only" for="agent-input">给数字分身发消息，每次最多100字</label>
          <textarea id="agent-input" rows="2" placeholder="有什么想和我聊的？" aria-describedby="agent-input-status agent-count" aria-invalid="false" required></textarea>
          <div class="agent-composer-bottom">
            <p class="agent-sr-only" id="agent-input-status" role="status" aria-live="polite"></p>
            <div class="agent-send-group">
              <span class="agent-sr-only" id="agent-count" aria-label="输入字数">0 / 100</span>
              <button class="agent-send" id="agent-send" type="submit" aria-label="发送消息" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg>
              </button>
            </div>
          </div>
        </form>
      </div>
      <noscript><p class="agent-noscript">开启 JavaScript 后即可使用对话。</p></noscript>
    </section>
