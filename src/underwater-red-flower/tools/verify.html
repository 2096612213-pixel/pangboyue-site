<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>水下红花 · 浏览器验收</title>
<style>*{box-sizing:border-box}body{margin:0;background:#141414;color:#ddd;font:12px -apple-system,sans-serif}header{display:flex;align-items:center;gap:8px;padding:12px;flex-wrap:wrap}button{background:#282828;color:#ddd;border:1px solid #555;border-radius:4px;padding:7px 10px}#view{position:relative;overflow:hidden;background:#000}iframe{width:1440px;height:900px;border:0;transform-origin:0 0;display:block}#report{padding:14px;white-space:pre-wrap;word-break:break-word;font:11px ui-monospace,monospace}h1{font-size:12px;margin:0 10px 0 0}.pass{color:#ddd}.fail{color:#ff7676}#status{font-size:11px;color:#999}</style>
<header><h1>浏览器验收</h1><button id="run">运行完整检查</button><button id="desktop">桌面构图</button><button id="mobile">手机构图</button><button id="motion">播放 / 暂停</button><button id="preview">生成场景预览</button><span id="status">准备中</span></header>
<div id="view"><iframe id="scene" src="../?qa=1" title="场景预览"></iframe></div><img id="artPreview" alt="从实时场景导出的桌面预览" hidden style="max-width:100%;height:auto"><div id="report" role="log"></div>
<script>
const frame=document.getElementById('scene'),view=document.getElementById('view'),report=document.getElementById('report'),status=document.getElementById('status');
let viewportWidth=1440,viewportHeight=900,results=[],baselineGrid=256;
const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function layout(){const scale=Math.min(1,innerWidth/viewportWidth);frame.style.width=viewportWidth+'px';frame.style.height=viewportHeight+'px';frame.style.transform=`scale(${scale})`;view.style.height=viewportHeight*scale+'px';}
addEventListener('resize',layout);layout();
function api(){return frame.contentWindow.UnderwaterStudio;}
function state(){return api().getState();}
function assert(condition,message){if(!condition)throw new Error(message||'Assertion failed');}
function pixels(){const canvas=frame.contentDocument.getElementById('glCanvas'),c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;const ctx=c.getContext('2d');ctx.drawImage(canvas,0,0);return {data:ctx.getImageData(0,0,c.width,c.height).data,width:c.width,height:c.height};}
function difference(a,b,start=0,end=1){assert(a.width===b.width&&a.height===b.height,'尺寸改变');let sum=0,count=0;for(let y=Math.floor(a.height*start);y<Math.floor(a.height*end);y++)for(let x=0;x<a.width;x++){const i=(y*a.width+x)*4;for(let c=0;c<3;c++)sum+=Math.abs(a.data[i+c]-b.data[i+c]);count++;}return sum/count;}
async function test(name,fn){status.textContent=name;try{const detail=await fn();results.push({name,pass:true,...(detail?{detail}:{})});}catch(error){results.push({name,pass:false,error:error.message});}report.textContent=JSON.stringify(results,null,2);await delay(15);}
function click(id){frame.contentDocument.getElementById(id).click();}
function slider(id,value){const el=frame.contentDocument.getElementById(id);el.value=value;el.dispatchEvent(new Event('input',{bubbles:true}));}
function reset(){api().reset();api().pause();}
async function ready(){for(let i=0;i<100;i++){if(api())return;await delay(80);}throw new Error('场景未就绪');}
frame.addEventListener('load',async()=>{await ready();status.textContent='就绪';report.textContent=JSON.stringify({initial:api().diagnostics(),water:api().debugWater()},null,2);});
document.getElementById('desktop').onclick=()=>{viewportWidth=1440;viewportHeight=900;layout();};
document.getElementById('mobile').onclick=()=>{viewportWidth=390;viewportHeight=844;layout();};
document.getElementById('motion').onclick=()=>{state().playing?api().pause():api().play();};
document.getElementById('preview').onclick=()=>{const image=document.getElementById('artPreview');image.src=api().capture();image.hidden=false;image.scrollIntoView({block:'start'});};
document.getElementById('run').onclick=async()=>{
 document.getElementById('run').disabled=true;results=[];await ready();reset();baselineGrid=state().gridResolution;
 await test('WebGL2、全部 Shader 与浮点目标正常',()=>{const d=api().diagnostics();assert(d.ready&&d.shaderErrors.length===0&&d.glErrors.length===0,JSON.stringify(d));return d;});
 await test('模拟初态具有有限、非零高度',()=>{const d=api().debugWater();assert(d.finite&&d.energy>1e-7,JSON.stringify(d));return d;});
 await test('暂停后画面与模拟时间保持稳定',async()=>{const a=pixels(),t=state().waterTime,p=state().phase;await delay(250);assert(difference(a,pixels())===0,'暂停画面仍变化');assert(t===state().waterTime&&p===state().phase);});
 await test('无需输入，水波和原花自动运动',async()=>{const a=pixels(),t=state().waterTime,p=state().phase;api().play();await delay(650);api().pause();const delta=difference(a,pixels());assert(state().waterTime>t&&state().phase!==p&&delta>.01,'自动运动未发生');return {pixelDifference:delta,waterElapsed:state().waterTime-t};});
 await test('水波速度改变不跳相位、不改变振幅和网格',()=>{reset();const t=state().waterTime,a=pixels(),s=state();api().set('waterSpeed',3);assert(state().waterTime===t&&state().waterAmplitude===s.waterAmplitude&&state().gridResolution===s.gridResolution);assert(difference(a,pixels())===0,'调速瞬间画面跳变');api().advance(.2,{flower:false});assert(Math.abs(state().waterTime-.6)<1e-6);api().set('waterSpeed',.05);api().advance(.2,{flower:false});assert(Math.abs(state().waterTime-.61)<1e-6);});
 await test('水波可独立运动，花瓣相位保持不变',()=>{reset();const p=state().phase,a=pixels();api().advance(.6,{flower:false});assert(state().phase===p);assert(difference(a,pixels(),0,.32)>.001,'水面未变化');return api().debugWater();});
 await test('64 / 128 / 256 / 512 重建无资源累积',()=>{reset();const resources=api().diagnostics().resources,t=state().waterTime;for(const n of [64,256,512,128,64,512,128]){api().set('gridResolution',n);const d=api().diagnostics();assert(d.waterGrid===n&&d.causticGrid===n);assert(JSON.stringify(d.resources)===JSON.stringify(resources),'资源数增长');assert(state().waterTime===t&&state().rippleScale===1&&state().waterAmplitude===1);assert(d.glErrors.length===0,JSON.stringify(d.glErrors));}return resources;});
 await test('波纹空间尺度与网格、振幅独立',()=>{reset();const a=pixels();api().set('rippleScale',.45);assert(state().gridResolution===baselineGrid&&state().waterAmplitude===1&&state().waterSpeed===1);assert(difference(a,pixels(),0,.35)>.01);});
 await test('花朵 0.25×—3× 保持浸没，镜头不动',()=>{reset();const camera=JSON.stringify(api().diagnostics().camera);for(const scale of [.25,.65,1,2,3]){api().set('objectScale',scale);const d=api().diagnostics();assert(JSON.stringify(d.camera)===camera);assert(d.flower.y+1.95*d.flower.scale<d.waterY-.1,'花冠越过水面');}api().set('objectScale',1);});
 await test('花瓣轮廓阴影来自动态花朵，强度实时有效',()=>{reset();api().set('shadowStrength',0);const a=pixels();api().set('shadowStrength',1);const delta=difference(a,pixels(),.4,1);assert(delta>.04,'接收面上的轮廓阴影不可见');return {receiverShadowDifference:delta};});
 await test('随水波变化的红色水面反射',()=>{reset();api().set('reflectionStrength',0);const a=pixels();api().set('reflectionStrength',1);const b=pixels();let red=0;for(let y=0;y<b.height*.30;y++)for(let x=0;x<b.width;x++){const i=(y*b.width+x)*4;if(b.data[i]>b.data[i+1]*1.4&&b.data[i]>30&&b.data[i]-a.data[i]>10)red++;}assert(red>30,'水面没有可见红色映像');return {redReflectedPixels:red};});
 await test('水面折射控制确实改变透射影像',()=>{reset();api().set('refractionStrength',0);const a=pixels();api().set('refractionStrength',2);const delta=difference(a,pixels(),0,.3);assert(delta>.02,'折射强度在当前构图中没有可见效果');return {transmissionDifference:delta};});
 await test('环境光纹只有灰阶，红色来自花朵及其映像',()=>{reset();const p=pixels();let nonGray=0,checked=0;for(let y=0;y<p.height*.95;y++)for(let x=0;x<p.width;x++){if(x>p.width*.25&&x<p.width*.75)continue;const i=(y*p.width+x)*4;const max=Math.max(...p.data.slice(i,i+3)),min=Math.min(...p.data.slice(i,i+3));checked++;if(max-min>2)nonGray++;}assert(nonGray/checked<.005,'环境出现非灰阶光纹');return {environmentPixels:checked,nonGrayPixels:nonGray};});
 await test('焦散亮度同时影响花朵与接收面',()=>{reset();api().set('causticsIntensity',0);const a=pixels();api().set('causticsIntensity',2.4);const b=pixels(),delta=difference(a,b,.4,1);assert(delta>.05);return {causticDifference:delta};});
 await test('原项目 13 个滑块完整保留、读数和状态同步',()=>{reset();const bindings={rippleSlider:'rippleStr',causticSlider:'causticStr',pondSlider:'pondStr',floatSlider:'floatStr',stamenSlider:'stamenStr',veinSlider:'veinStr',stemSlider:'stemStr',warmthSlider:'warmth',speedSlider:'speed',backgroundSlider:'backgroundStrength',petalFlowSlider:'petalFlowStrength',flowerScaleSlider:'flowerScale',colorAmount:'colorMix'};for(const [id,key] of Object.entries(bindings)){const input=frame.contentDocument.getElementById(id);assert(input,`缺少 ${id}`);const val=(Number(input.min)+Number(input.max))/2;slider(id,val);assert(Math.abs(state()[key]-Number(input.value))<1e-6,`${id} 未同步`);}return Object.keys(bindings);});
 await test('原项目四种预设保留原值',()=>{reset();const presets={original:[1.45,1.15,2,1,1.45,.55],hyperreal:[1.55,1.3,1.95,1.15,1.25,.65],crystal_pond:[1.65,1.4,1.8,1.2,.75,.65],golden_sss:[1.35,1.65,2,1.15,1.85,.6]};for(const [name,expected] of Object.entries(presets)){frame.contentDocument.querySelector(`[data-preset="${name}"]`).click();const s=state();assert(JSON.stringify([s.floatStr,s.stamenStr,s.veinStr,s.stemStr,s.warmth,s.speed])===JSON.stringify(expected),name);}});
 await test('原花点击涟漪与真实水面点击均保留',()=>{reset();api().set('rippleStr',1);const canvas=frame.contentDocument.getElementById('glCanvas'),r=canvas.getBoundingClientRect(),before=api().diagnostics().nativeDropIndex;canvas.dispatchEvent(new frame.contentWindow.PointerEvent('pointerdown',{clientX:r.left+r.width*.5,clientY:r.top+r.height*.6,bubbles:true}));const d=api().diagnostics();assert(d.nativeDropIndex===(before+1)%10);assert(d.lastNativeDrop[0]>0&&d.lastNativeDrop[0]<1&&d.lastNativeDrop[1]>0&&d.lastNativeDrop[1]<1,'点击坐标没有映射到原花空间');const time=state().waterTime;canvas.dispatchEvent(new frame.contentWindow.PointerEvent('pointerdown',{clientX:r.left+r.width*.25,clientY:r.top+r.height*.15,bubbles:true}));assert(state().waterTime>time,'点击水面没有扰动模拟');});
 await test('保存 / 恢复预设、调色盘与渲染分辨率',()=>{reset();api().set('objectScale',1.37);api().set('waterSpeed',.43);click('savePreset');api().set('objectScale',.3);api().set('waterSpeed',2);click('loadPreset');assert(state().objectScale===1.37&&state().waterSpeed===.43);frame.contentDocument.querySelector('[data-flower-color="silver"]').click();assert(state().colorMix===0);api().set('flowerColor','#c8102e');api().set('colorMix',.95);for(const r of [1024,1280,1600]){frame.contentDocument.querySelector(`[data-res="${r}"]`).click();assert(state().res===r);}});
 await test('上 / 下一帧保留原花相位步进',()=>{reset();const p=state().phase,t=state().waterTime;click('stepNextBtn');assert(Math.abs(state().phase-p-2*Math.PI/50)<1e-6);click('stepPrevBtn');assert(Math.abs(state().phase-p)<1e-6&&state().waterTime===t&&!state().playing);});
 await test('三个质量档位切换无资源泄漏',()=>{reset();const count=api().diagnostics().resources;for(const q of ['low','high','balanced','high','low','balanced']){api().set('quality',q);assert(JSON.stringify(api().diagnostics().resources)===JSON.stringify(count));}assert(api().diagnostics().flowerTexture[0]===768);});
 await test('完整场景 PNG 与透明花朵导出',async()=>{reset();const full=api().capture(),icon=api().extractFlowerIcon();for(const [data,label] of [[full,'scene'],[icon,'icon']]){const image=new Image();await new Promise((resolve,reject)=>{image.onload=resolve;image.onerror=reject;image.src=data;});if(label==='scene')assert(Math.max(image.width,image.height)===state().res);else{assert(image.width===512&&image.height===512);const c=document.createElement('canvas');c.width=c.height=512;const ctx=c.getContext('2d');ctx.drawImage(image,0,0);const a=ctx.getImageData(0,0,512,512).data;assert(a[3]===0&&a.some((v,i)=>i%4===3&&v>100),'导出没有透明背景或花朵');}}});
 await test('连续模拟 20 秒保持有限、资源稳定',()=>{reset();api().set('quality','low');api().set('gridResolution',64);const resources=api().diagnostics().resources;api().advance(20,{flower:false});const water=api().debugWater();assert(water.finite&&water.energy>1e-8&&water.max<2&&water.min>-2,JSON.stringify(water));assert(JSON.stringify(api().diagnostics().resources)===JSON.stringify(resources));return water;});
 await test('最终状态无 WebGL 错误',()=>{const d=api().diagnostics();assert(d.glErrors.length===0&&d.shaderErrors.length===0,JSON.stringify(d));return d;});
 await test('390×844 手机布局可折叠且没有横向溢出',async()=>{viewportWidth=390;viewportHeight=844;layout();await delay(150);const doc=frame.contentDocument;assert(doc.documentElement.scrollWidth===390,`页面宽度 ${doc.documentElement.scrollWidth}`);click('panelToggle');const hidden=doc.body.classList.contains('panel-hidden');click('panelToggle');assert(doc.body.classList.contains('panel-hidden')!==hidden);});
 await test('桌面连续播放帧率采样',async()=>{viewportWidth=1440;viewportHeight=900;layout();reset();api().play();await delay(2500);api().pause();return {fps:api().diagnostics().fps,canvas:api().diagnostics().canvas,quality:state().quality,note:'仅代表此浏览器当前设备，非手机性能认证'};});
 reset();viewportWidth=1440;viewportHeight=900;layout();
 const passed=results.filter(x=>x.pass).length;status.textContent=`完成：${passed} / ${results.length} 项通过`;report.textContent=JSON.stringify({passed,total:results.length,results},null,2);document.getElementById('run').disabled=false;
};
</script></html>
